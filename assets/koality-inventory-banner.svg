<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="40%" stop-color="#0F172A" />
      <stop offset="80%" stop-color="#091322" />
      <stop offset="100%" stop-color="#040812" />
    </linearGradient>

    <!-- Emerald Primary Gradient -->
    <linearGradient id="emeraldBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Cyan / Tech Blue Gradient -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Rack Steel Gradient -->
    <linearGradient id="steelBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="emeraldAura" cx="20%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="blueAura" cx="85%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12" />
      <stop offset="80%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .brand-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 46px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .brand-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 19px;
        font-weight: 400;
        fill: #94A3B8;
      }
      .badge-text {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.4px;
      }
      .diag-text {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 11px;
        font-weight: 500;
      }
    </style>
  </defs>

  <!-- Banner Background Canvas -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGradBanner)" stroke="#1E293B" stroke-width="2" />

  <!-- Ambient Glow Backdrops -->
  <rect width="1200" height="380" rx="16" fill="url(#emeraldAura)" />
  <rect width="1200" height="380" rx="16" fill="url(#blueAura)" />

  <!-- Structural Background Grid & Warehouse Perspective Lines -->
  <g opacity="0.12" stroke="#64748B" stroke-width="1">
    <line x1="0" y1="95" x2="1200" y2="95" />
    <line x1="0" y1="190" x2="1200" y2="190" />
    <line x1="0" y1="285" x2="1200" y2="285" />

    <line x1="200" y1="0" x2="200" y2="380" />
    <line x1="450" y1="0" x2="450" y2="380" />
    <line x1="720" y1="0" x2="720" y2="380" />
    <line x1="980" y1="0" x2="980" y2="380" />
  </g>

  <!-- Left Side: Brand Identity & Typography -->
  <g transform="translate(64, 52)">
    <!-- Brand Mark Icon Box (Mini-Logo) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="68" height="68" rx="18" fill="#0B1329" stroke="url(#emeraldBanner)" stroke-width="2" />
      <!-- Mini Isometric Cube inside Icon -->
      <g transform="translate(34, 34)">
        <path d="M 0 -15 L 14 -7 L 0 1 L -14 -7 Z" fill="#34D399" />
        <path d="M -14 -7 L 0 1 L 0 16 L -14 8 Z" fill="#059669" />
        <path d="M 0 1 L 14 -7 L 14 8 L 0 16 Z" fill="#047857" />
        <line x1="-14" y1="4" x2="14" y2="-4" stroke="#F43F5E" stroke-width="1.5" stroke-linecap="round" />
      </g>
    </g>

    <!-- Main Title & Logo Badge -->
    <g transform="translate(86, 48)">
      <text class="brand-title">
        <tspan fill="#F8FAFC">KOALITY </tspan>
        <tspan fill="url(#emeraldBanner)">INVENTORY</tspan>
      </text>
    </g>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="112" class="brand-subtitle">
      Enterprise Dual-Operation Inventory Platform &amp; Warehouse Ledger Engine
    </text>
    <text x="0" y="138" class="brand-subtitle" fill="#64748B" font-size="15px">
      Engineered for autonomous AI agents (MCP &amp; REST) and warehouse operations teams.
    </text>

    <!-- Capability Chips / Metadata Badges -->
    <g transform="translate(0, 172)">
      <!-- Badge 1: Dual Storage -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="232" height="30" rx="7" fill="#131F37" stroke="#253554" stroke-width="1.2" />
        <circle cx="16" cy="15" r="4.5" fill="#38BDF8" />
        <text x="30" y="19.5" fill="#E2E8F0" class="badge-text">POSTGRESQL + SQLITE DUAL-CORE</text>
      </g>

      <!-- Badge 2: MCP Server -->
      <g transform="translate(244, 0)">
        <rect x="0" y="0" width="190" height="30" rx="7" fill="#0F291E" stroke="#1B4D3E" stroke-width="1.2" />
        <circle cx="16" cy="15" r="4.5" fill="#10B981" />
        <text x="30" y="19.5" fill="#D1FAE5" class="badge-text">AGENT-FIRST MCP SERVER</text>
      </g>

      <!-- Badge 3: Type-Prefixed ULID -->
      <g transform="translate(0, 38)">
        <rect x="0" y="0" width="205" height="30" rx="7" fill="#1E1E2E" stroke="#373750" stroke-width="1.2" />
        <circle cx="16" cy="15" r="4.5" fill="#A78BFA" />
        <text x="30" y="19.5" fill="#EDE9FE" class="badge-text">DETERMINISTIC ULID LEDGER</text>
      </g>

      <!-- Badge 4: Warehouse Topology -->
      <g transform="translate(217, 38)">
        <rect x="0" y="0" width="217" height="30" rx="7" fill="#261E14" stroke="#4A3B24" stroke-width="1.2" />
        <circle cx="16" cy="15" r="4.5" fill="#FBBF24" />
        <text x="30" y="19.5" fill="#FEF3C7" class="badge-text">FACILITY-TO-BIN TOPOLOGY</text>
      </g>
    </g>

    <!-- Operational State Metrics Bar -->
    <g transform="translate(0, 258)">
      <line x1="0" y1="0" x2="480" y2="0" stroke="#1E293B" stroke-width="1" />
      <text x="0" y="24" fill="#64748B" class="diag-text">STOCK STATES:</text>
      <text x="96" y="24" fill="#34D399" class="diag-text">ON-HAND</text>
      <text x="162" y="24" fill="#64748B" class="diag-text">•</text>
      <text x="178" y="24" fill="#38BDF8" class="diag-text">ALLOCATED</text>
      <text x="254" y="24" fill="#64748B" class="diag-text">•</text>
      <text x="270" y="24" fill="#FBBF24" class="diag-text">ATP (AVAILABLE)</text>
      <text x="375" y="24" fill="#64748B" class="diag-text">•</text>
      <text x="391" y="24" fill="#F472B6" class="diag-text">IN-TRANSIT</text>
    </g>
  </g>

  <!-- Right Side: Architectural Warehouse & Autonomous Agent Visualization -->
  <g transform="translate(730, 42)">
    <!-- Container Card -->
    <rect x="0" y="0" width="410" height="296" rx="14" fill="#0C1427" stroke="#1E293B" stroke-width="1.5" />

    <!-- Terminal / Blueprint Window Header -->
    <path d="M 0 14 C 0 6.268 6.268 0 14 0 L 396 0 C 403.732 0 410 6.268 410 14 L 410 36 L 0 36 Z" fill="#152037" />
    <circle cx="20" cy="18" r="4.5" fill="#EF4444" />
    <circle cx="36" cy="18" r="4.5" fill="#F59E0B" />
    <circle cx="52" cy="18" r="4.5" fill="#10B981" />
    <text x="74" y="22" fill="#94A3B8" class="diag-text">ledger_topology :: facility-to-bin architecture</text>

    <!-- Industrial Storage Rack Geometry -->
    <g transform="translate(30, 52)">
      <!-- Structural Vertical Columns -->
      <line x1="20" y1="16" x2="20" y2="188" stroke="url(#steelBeam)" stroke-width="3" />
      <line x1="180" y1="16" x2="180" y2="188" stroke="url(#steelBeam)" stroke-width="3" />
      <line x1="330" y1="16" x2="330" y2="188" stroke="url(#steelBeam)" stroke-width="3" />

      <!-- Horizontal Shelf Beams -->
      <line x1="16" y1="74" x2="334" y2="74" stroke="#64748B" stroke-width="3" />
      <line x1="16" y1="134" x2="334" y2="134" stroke="#64748B" stroke-width="3" />
      <line x1="16" y1="188" x2="334" y2="188" stroke="#64748B" stroke-width="3.5" />

      <!-- Cross Bracing in Bay 2 -->
      <line x1="180" y1="74" x2="330" y2="16" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3" />
      <line x1="180" y1="16" x2="330" y2="74" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3" />

      <!-- Bay 1, Tier 1: High-Velocity Pallet / Crate (Emerald ATP) -->
      <g transform="translate(36, 26)">
        <rect x="0" y="0" width="56" height="46" rx="4" fill="#064E3B" stroke="#10B981" stroke-width="1.5" />
        <!-- Barcode lines -->
        <line x1="8" y1="10" x2="8" y2="34" stroke="#A7F3D0" stroke-width="1.8" />
        <line x1="14" y1="10" x2="14" y2="34" stroke="#A7F3D0" stroke-width="3" />
        <line x1="22" y1="10" x2="22" y2="34" stroke="#A7F3D0" stroke-width="1.2" />
        <line x1="28" y1="10" x2="28" y2="34" stroke="#A7F3D0" stroke-width="2.5" />
        <line x1="36" y1="10" x2="36" y2="34" stroke="#A7F3D0" stroke-width="1.5" />
        <line x1="44" y1="10" x2="44" y2="34" stroke="#A7F3D0" stroke-width="2" />
      </g>

      <!-- Bay 1, Tier 1 Second Box -->
      <g transform="translate(104, 30)">
        <rect x="0" y="0" width="56" height="42" rx="4" fill="#0F2942" stroke="#38BDF8" stroke-width="1.5" />
        <path d="M12 21 L22 31 L44 11" stroke="#38BDF8" stroke-width="2" fill="none" stroke-linecap="round" />
      </g>

      <!-- Bay 1, Tier 2: Mid-tier Bins -->
      <g transform="translate(36, 88)">
        <rect x="0" y="0" width="40" height="44" rx="3" fill="#1E293B" stroke="#64748B" stroke-width="1.2" />
        <text x="6" y="26" fill="#94A3B8" class="diag-text" font-size="9px">bin_01</text>
      </g>
      <g transform="translate(86, 88)">
        <rect x="0" y="0" width="40" height="44" rx="3" fill="#1E293B" stroke="#64748B" stroke-width="1.2" />
        <text x="6" y="26" fill="#94A3B8" class="diag-text" font-size="9px">bin_02</text>
      </g>
      <g transform="translate(134, 88)">
        <rect x="0" y="0" width="34" height="44" rx="3" fill="#312E81" stroke="#818CF8" stroke-width="1.2" />
        <text x="4" y="26" fill="#C7D2FE" class="diag-text" font-size="8.5px">FIFO</text>
      </g>

      <!-- Bay 2, Tier 2: Quarantined Lot -->
      <g transform="translate(200, 88)">
        <rect x="0" y="0" width="54" height="44" rx="3" fill="#451A03" stroke="#F59E0B" stroke-width="1.4" />
        <text x="7" y="26" fill="#FDE68A" class="diag-text" font-size="8.5px">lot_qa</text>
      </g>

      <!-- Bay 2, Tier 3: Ground Pallets -->
      <g transform="translate(200, 146)">
        <rect x="0" y="0" width="112" height="40" rx="3" fill="#111827" stroke="#475569" stroke-width="1.2" />
        <text x="14" y="24" fill="#94A3B8" class="diag-text">BULK STORAGE ZONE</text>
      </g>
      <g transform="translate(36, 146)">
        <rect x="0" y="0" width="132" height="40" rx="3" fill="#111827" stroke="#475569" stroke-width="1.2" />
        <text x="12" y="24" fill="#34D399" class="diag-text">ACTIVE PICK MODULE</text>
      </g>

      <!-- Active Laser Scan Beam -->
      <line x1="16" y1="48" x2="175" y2="48" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round" opacity="0.9" />
      <circle cx="102" cy="48" r="3" fill="#EF4444" filter="url(#glow)" />
    </g>

    <!-- Bottom Telemetry HUD -->
    <g transform="translate(20, 248)">
      <rect x="0" y="0" width="370" height="34" rx="6" fill="#111C33" stroke="#1E293B" stroke-width="1" />
      <circle cx="16" cy="17" r="4" fill="#10B981" />
      <text x="28" y="21" fill="#E2E8F0" class="diag-text">
        <tspan fill="#34D399">ULID:</tspan> stk_01jk8a01b2c3d4e5f6g7h8j9k5
      </text>
    </g>
  </g>
</svg>
