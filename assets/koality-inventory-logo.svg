<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0A1124" />
      <stop offset="100%" stop-color="#050B14" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.4" />
    </linearGradient>

    <!-- Emerald Primary Gradient -->
    <linearGradient id="emeraldPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Emerald Dark Gradient for Isometric Depth -->
    <linearGradient id="emeraldDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#044E3B" />
    </linearGradient>

    <!-- Slate Metal Frame Gradient -->
    <linearGradient id="rackBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter for Floating Box -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle Container -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Ambient Internal Glow -->
  <circle cx="128" cy="128" r="95" fill="url(#centerGlow)" />

  <!-- Background Subtle Grid / Aisle Guide Lines -->
  <g opacity="0.15" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3 3">
    <line x1="48" y1="184" x2="208" y2="184" />
    <line x1="48" y1="140" x2="208" y2="140" />
    <line x1="48" y1="96" x2="208" y2="96" />
    <line x1="88" y1="60" x2="88" y2="200" />
    <line x1="168" y1="60" x2="168" y2="200" />
  </g>

  <!-- Industrial Warehouse Upright Columns & Cross-Bracing -->
  <g stroke="url(#rackBeam)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Upright Post -->
    <line x1="56" y1="68" x2="56" y2="196" />
    <rect x="52" y="196" width="8" height="4" rx="1" fill="#64748B" />
    <!-- Right Upright Post -->
    <line x1="200" y1="68" x2="200" y2="196" />
    <rect x="196" y="196" width="8" height="4" rx="1" fill="#64748B" />

    <!-- Storage Rack Horizontal Shelves -->
    <!-- Top Shelf -->
    <line x1="56" y1="108" x2="200" y2="108" stroke="#64748B" stroke-width="3" />
    <!-- Bottom Shelf -->
    <line x1="56" y1="172" x2="200" y2="172" stroke="#64748B" stroke-width="3.5" />

    <!-- Diagonal Stabilizer Braces -->
    <line x1="56" y1="108" x2="92" y2="68" stroke="#475569" stroke-width="2" stroke-opacity="0.5" />
    <line x1="200" y1="108" x2="164" y2="68" stroke="#475569" stroke-width="2" stroke-opacity="0.5" />
    <line x1="56" y1="172" x2="96" y2="128" stroke="#475569" stroke-width="2" stroke-opacity="0.4" />
    <line x1="200" y1="172" x2="160" y2="128" stroke="#475569" stroke-width="2" stroke-opacity="0.4" />
  </g>

  <!-- Lower Shelf Inventory Storage Packages -->
  <!-- Box Left: Slate / Charcoal Inventory Crate -->
  <g transform="translate(68, 132)">
    <rect x="0" y="0" width="34" height="38" rx="3" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
    <!-- Barcode Strip -->
    <line x1="6" y1="10" x2="6" y2="28" stroke="#94A3B8" stroke-width="2" />
    <line x1="11" y1="10" x2="11" y2="28" stroke="#94A3B8" stroke-width="1" />
    <line x1="15" y1="10" x2="15" y2="28" stroke="#94A3B8" stroke-width="3" />
    <line x1="21" y1="10" x2="21" y2="28" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="26" y1="10" x2="26" y2="28" stroke="#94A3B8" stroke-width="2" />
  </g>

  <!-- Box Right: Compact Verified Bin -->
  <g transform="translate(154, 136)">
    <rect x="0" y="0" width="34" height="34" rx="3" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
    <path d="M7 17 L14 24 L27 10" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Center Highlight: Isometric Emerald Cube with Barcode & Quality Shield -->
  <g transform="translate(128, 126)">
    <!-- Isometric Top Face -->
    <path d="M 0 -42 L 36 -21 L 0 0 L -36 -21 Z" fill="#34D399" />
    <!-- Isometric Left Face -->
    <path d="M -36 -21 L 0 0 L 0 42 L -36 21 Z" fill="#059669" />
    <!-- Isometric Right Face -->
    <path d="M 0 0 L 36 -21 L 36 21 L 0 42 Z" fill="#047857" />

    <!-- Isometric Cube Outlines & Creases -->
    <path d="M 0 -42 L 36 -21 L 0 0 L -36 -21 Z M 0 0 L 0 42 M -36 -21 L -36 21 L 0 42 L 36 21 L 36 -21"
          fill="none" stroke="#6EE7B7" stroke-width="1.5" stroke-linejoin="round" />

    <!-- Barcode Laser on Left Face -->
    <g transform="skewY(30) scale(1, 0.866)" opacity="0.85">
      <line x1="-28" y1="-4" x2="-28" y2="18" stroke="#D1FAE5" stroke-width="1.5" />
      <line x1="-24" y1="-4" x2="-24" y2="18" stroke="#D1FAE5" stroke-width="2.5" />
      <line x1="-18" y1="-4" x2="-18" y2="18" stroke="#D1FAE5" stroke-width="1" />
      <line x1="-14" y1="-4" x2="-14" y2="18" stroke="#D1FAE5" stroke-width="2" />
      <line x1="-8" y1="-4" x2="-8" y2="18" stroke="#D1FAE5" stroke-width="3" />
    </g>

    <!-- Laser Scan Beam Across the Cube Face -->
    <line x1="-38" y1="10" x2="38" y2="-10" stroke="#F43F5E" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />
  </g>

  <!-- Top Center: Protective Koality Shield Crest -->
  <g transform="translate(128, 54)">
    <!-- Shield Outer Glow -->
    <path d="M 0 -16 Q 18 -16 22 2 Q 22 22 0 32 Q -22 22 -22 2 Q -18 -16 0 -16 Z"
          fill="#0F172A" stroke="url(#emeraldPrimary)" stroke-width="2.5" />
    <!-- Shield Core Checkmark -->
    <path d="M -8 6 L -2 12 L 9 1"
          fill="none" stroke="#34D399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Status Indicator Node (Real-time Ledger Active) -->
  <circle cx="188" cy="72" r="5" fill="#10B981" filter="url(#glowFilter)" />
  <circle cx="188" cy="72" r="3" fill="#ECFDF5" />
</svg>
